<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucky Alchemist</title>
    <!--
      Google Fonts via CDN for now (Stage 0). Revisit before Stage 4's bundle-budget pass —
      portals generally want self-hosted, subsetted fonts instead of a runtime fetch.
      Cartoon idle-RPG look: Fredoka (chunky rounded display) for titles/numbers + Nunito
      (rounded body) for copy. UI copy is English, so no Cyrillic subset is needed.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/grimoire.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
